name: Build DesignCAD APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    name: Build DesignCAD
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Create DesignCAD project
        shell: bash
        run: |
          mkdir -p app/src/main/java/com/example/designcad
          mkdir -p app/src/main/res/values

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "DesignCAD"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.example.designcad"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.example.designcad"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = 1
                  versionName = "0.1.0"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
              }
          }

          kotlin {
              jvmToolchain(17)
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:theme="@style/AppTheme"
                  android:label="DesignCAD"
                  android:allowBackup="true"
                  android:supportsRtl="true">

                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="landscape"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>

              <style name="AppTheme"
                  parent="@android:style/Theme.Material.Light.NoActionBar">

                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#4285F4</item>
                  <item name="android:navigationBarColor">#101114</item>
                  <item name="android:statusBarColor">#101114</item>
                  <item name="android:windowLightStatusBar">false</item>

              </style>

          </resources>
          EOF

          cat > app/src/main/java/com/example/designcad/Vec3.kt <<'EOF'
          package com.example.designcad

          data class Vec3(
              var x: Float,
              var y: Float,
              var z: Float
          )
          EOF

          cat > app/src/main/java/com/example/designcad/CubeModel.kt <<'EOF'
          package com.example.designcad

          enum class Face {
              FRONT,
              BACK,
              LEFT,
              RIGHT,
              TOP,
              BOTTOM
          }

          class CubeModel {

              var width = 2f
              var height = 2f
              var depth = 2f

              var selectedFace: Face? = null

              fun vertices(): Array<Vec3> {
                  val x = width / 2f
                  val y = height / 2f
                  val z = depth / 2f

                  return arrayOf(
                      Vec3(-x, -y, -z),
                      Vec3(x, -y, -z),
                      Vec3(x, y, -z),
                      Vec3(-x, y, -z),

                      Vec3(-x, -y, z),
                      Vec3(x, -y, z),
                      Vec3(x, y, z),
                      Vec3(-x, y, z)
                  )
              }

              fun pushPull(delta: Float) {
                  when (selectedFace) {
                      Face.FRONT, Face.BACK ->
                          depth = (depth + delta).coerceAtLeast(0.2f)

                      Face.LEFT, Face.RIGHT ->
                          width = (width + delta).coerceAtLeast(0.2f)

                      Face.TOP, Face.BOTTOM ->
                          height = (height + delta).coerceAtLeast(0.2f)

                      null -> Unit
                  }
              }

              fun reset() {
                  width = 2f
                  height = 2f
                  depth = 2f
                  selectedFace = null
              }
          }
          EOF

          cat > app/src/main/java/com/example/designcad/MainActivity.kt <<'EOF'
          package com.example.designcad

          import android.app.Activity
          import android.graphics.*
          import android.os.Bundle
          import android.view.MotionEvent
          import android.view.View
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.TextView
          import kotlin.math.cos
          import kotlin.math.sin
          import kotlin.math.abs

          class MainActivity : Activity() {

              private lateinit var cadView: CadView
              private lateinit var info: TextView

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  val root = LinearLayout(this)
                  root.orientation = LinearLayout.VERTICAL
                  root.setBackgroundColor(Color.rgb(20, 21, 25))

                  val toolbar = LinearLayout(this)
                  toolbar.orientation = LinearLayout.HORIZONTAL
                  toolbar.setPadding(8, 4, 8, 4)
                  toolbar.setBackgroundColor(Color.rgb(30, 31, 36))

                  fun button(text: String): Button {
                      return Button(this).apply {
                          this.text = text
                          textSize = 11f
                      }
                  }

                  val title = TextView(this)
                  title.text = "  DesignCAD"
                  title.textSize = 19f
                  title.setTextColor(Color.WHITE)

                  toolbar.addView(
                      title,
                      LinearLayout.LayoutParams(
                          0,
                          LinearLayout.LayoutParams.WRAP_CONTENT,
                          1f
                      )
                  )

                  val cubeButton = button("＋ Куб")
                  val selectButton = button("Выбор")
                  val pushButton = button("Push/Pull")
                  val resetButton = button("Сброс")

                  toolbar.addView(cubeButton)
                  toolbar.addView(selectButton)
                  toolbar.addView(pushButton)
                  toolbar.addView(resetButton)

                  root.addView(toolbar)

                  cadView = CadView()

                  root.addView(
                      cadView,
                      LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          0,
                          1f
                      )
                  )

                  info = TextView(this)
                  info.text = "Куб 20 × 20 × 20 мм"
                  info.textSize = 14f
                  info.setTextColor(Color.LTGRAY)
                  info.setPadding(16, 8, 16, 8)
                  info.setBackgroundColor(Color.rgb(30, 31, 36))

                  root.addView(info)

                  setContentView(root)

                  cubeButton.setOnClickListener {
                      cadView.cube.reset()
                      cadView.invalidate()
                      updateInfo()
                  }

                  selectButton.setOnClickListener {
                      cadView.mode = CadView.Mode.SELECT
                      info.text = "Выбор: коснитесь грани куба"
                  }

                  pushButton.setOnClickListener {
                      cadView.mode = CadView.Mode.PUSH_PULL
                      info.text = "Push/Pull: проведите пальцем вверх/вниз"
                  }

                  resetButton.setOnClickListener {
                      cadView.cube.reset()
                      cadView.rotationX = -25f
                      cadView.rotationY = 35f
                      cadView.invalidate()
                      updateInfo()
                  }
              }

              private fun updateInfo() {
                  val c = cadView.cube
                  val face = c.selectedFace

                  info.text =
                      if (face == null) {
                          "Куб %.1f × %.1f × %.1f мм".format(
                              c.width * 10f,
                              c.height * 10f,
                              c.depth * 10f
                          )
                      } else {
                          "Выбрана $face | %.1f × %.1f × %.1f мм".format(
                              c.width * 10f,
                              c.height * 10f,
                              c.depth * 10f
                          )
                      }
              }

              inner class CadView : View(this@MainActivity) {

                  enum class Mode {
                      SELECT,
                      PUSH_PULL
                  }

                  val cube = CubeModel()

                  var mode = Mode.SELECT

                  var rotationX = -25f
                  var rotationY = 35f

                  private var lastX = 0f
                  private var lastY = 0f
                  private var moved = false

                  private val fill = Paint(Paint.ANTI_ALIAS_FLAG)
                  private val stroke = Paint(Paint.ANTI_ALIAS_FLAG)

                  init {
                      setBackgroundColor(Color.rgb(22, 23, 27))

                      stroke.style = Paint.Style.STROKE
                      stroke.strokeWidth = 3f
                  }

                  data class P(
                      val x: Float,
                      val y: Float,
                      val z: Float
                  )

                  data class FaceDraw(
                      val face: Face,
                      val indices: IntArray
                  )

                  override fun onDraw(canvas: Canvas) {
                      super.onDraw(canvas)

                      drawGrid(canvas)

                      val vertices = cube.vertices()
                      val points = Array(vertices.size) {
                          project(vertices[it])
                      }

                      val faces = listOf(
                          FaceDraw(Face.FRONT, intArrayOf(4, 5, 6, 7)),
                          FaceDraw(Face.BACK, intArrayOf(0, 1, 2, 3)),
                          FaceDraw(Face.LEFT, intArrayOf(0, 4, 7, 3)),
                          FaceDraw(Face.RIGHT, intArrayOf(1, 5, 6, 2)),
                          FaceDraw(Face.TOP, intArrayOf(3, 7, 6, 2)),
                          FaceDraw(Face.BOTTOM, intArrayOf(0, 4, 5, 1))
                      )

                      val sorted = faces.sortedBy {
                          face -> -face.indices.map { points[it].z }.average()
                      }

                      sorted.forEach {
                          drawFace(canvas, it, points)
                      }
                  }

                  private fun project(v: Vec3): P {
                      val ry = Math.toRadians(rotationY.toDouble())
                      val cy = cos(ry).toFloat()
                      val sy = sin(ry).toFloat()

                      val x1 = v.x * cy - v.z * sy
                      val z1 = v.x * sy + v.z * cy

                      val rx = Math.toRadians(rotationX.toDouble())
                      val cx = cos(rx).toFloat()
                      val sx = sin(rx).toFloat()

                      val y2 = v.y * cx - z1 * sx
                      val z2 = v.y * sx + z1 * cx

                      val distance = 8f
                      val scale = distance / (distance + z2)

                      return P(
                          width / 2f + x1 * 130f * scale,
                          height / 2f - y2 * 130f * scale,
                          z2
                      )
                  }

                  private fun drawFace(
                      canvas: Canvas,
                      face: FaceDraw,
                      points: Array<P>
                  ) {
                      val path = Path()

                      val first = points[face.indices[0]]
                      path.moveTo(first.x, first.y)

                      for (i in 1 until face.indices.size) {
                          val p = points[face.indices[i]]
                          path.lineTo(p.x, p.y)
                      }

                      path.close()

                      val selected = cube.selectedFace == face.face

                      fill.style = Paint.Style.FILL
                      fill.color =
                          if (selected) {
                              Color.rgb(45, 140, 235)
                          } else {
                              when (face.face) {
                                  Face.TOP ->
                                      Color.rgb(115, 145, 180)

                                  Face.FRONT ->
                                      Color.rgb(85, 110, 145)

                                  else ->
                                      Color.rgb(65, 80, 105)
                              }
                          }

                      canvas.drawPath(path, fill)

                      stroke.color =
                          if (selected) Color.WHITE
                          else Color.rgb(25, 25, 30)

                      stroke.strokeWidth =
                          if (selected) 5f else 3f

                      canvas.drawPath(path, stroke)
                  }

                  private fun drawGrid(canvas: Canvas) {
                      val paint = Paint(Paint.ANTI_ALIAS_FLAG)

                      paint.color = Color.rgb(38, 40, 46)
                      paint.strokeWidth = 1f

                      val cy = height / 2f

                      for (i in -10..10) {
                          val x = width / 2f + i * 35f

                          canvas.drawLine(
                              x,
                              cy - 350,
                              x,
                              cy + 350,
                              paint
                          )
                      }

                      for (i in -10..10) {
                          val y = cy + i * 35f

                          canvas.drawLine(
                              width / 2f - 350,
                              y,
                              width / 2f + 350,
                              y,
                              paint
                          )
                      }
                  }

                  override fun onTouchEvent(event: MotionEvent): Boolean {
                      when (event.actionMasked) {

                          MotionEvent.ACTION_DOWN -> {
                              lastX = event.x
                              lastY = event.y
                              moved = false
                              return true
                          }

                          MotionEvent.ACTION_MOVE -> {
                              val dx = event.x - lastX
                              val dy = event.y - lastY

                              if (abs(dx) > 3 || abs(dy) > 3) {
                                  moved = true
                              }

                              if (
                                  mode == Mode.PUSH_PULL &&
                                  cube.selectedFace != null
                              ) {
                                  cube.pushPull(-dy * 0.01f)
                                  invalidate()

                                  info.text =
                                      "Push/Pull | %.1f × %.1f × %.1f мм".format(
                                          cube.width * 10f,
                                          cube.height * 10f,
                                          cube.depth * 10f
                                      )
                              } else {
                                  rotationY += dx * 0.5f
                                  rotationX =
                                      (rotationX + dy * 0.5f)
                                          .coerceIn(-89f, 89f)

                                  invalidate()
                              }

                              lastX = event.x
                              lastY = event.y

                              return true
                          }

                          MotionEvent.ACTION_UP -> {
                              if (!moved) {
                                  pickFace(event.x, event.y)
                              }

                              return true
                          }
                      }

                      return true
                  }

                  private fun pickFace(
                      x: Float,
                      y: Float
                  ) {
                      val vertices = cube.vertices()
                      val points = Array(vertices.size) {
                          project(vertices[it])
                      }

                      val faces = listOf(
                          FaceDraw(Face.FRONT, intArrayOf(4, 5, 6, 7)),
                          FaceDraw(Face.BACK, intArrayOf(0, 1, 2, 3)),
                          FaceDraw(Face.LEFT, intArrayOf(0, 4, 7, 3)),
                          FaceDraw(Face.RIGHT, intArrayOf(1, 5, 6, 2)),
                          FaceDraw(Face.TOP, intArrayOf(3, 7, 6, 2)),
                          FaceDraw(Face.BOTTOM, intArrayOf(0, 4, 5, 1))
                      )

                      val sorted = faces.sortedBy {
                          face -> -face.indices.map { points[it].z }.average()
                      }

                      for (face in sorted) {
                          val polygon = face.indices.map { points[it] }

                          if (inside(x, y, polygon)) {
                              cube.selectedFace = face.face
                              invalidate()
                              updateInfo()
                              return
                          }
                      }
                  }

                  private fun inside(
                      x: Float,
                      y: Float,
                      polygon: List<P>
                  ): Boolean {
                      var result = false
                      var j = polygon.lastIndex

                      for (i in polygon.indices) {
                          val xi = polygon[i].x
                          val yi = polygon[i].y
                          val xj = polygon[j].x
                          val yj = polygon[j].y

                          if (
                              ((yi > y) != (yj > y)) &&
                              (x < (xj - xi) * (y - yi) /
                                  (yj - yi + 0.00001f) + xi)
                          ) {
                              result = !result
                          }

                          j = i
                      }

                      return result
                  }
              }
          }
          EOF

      - name: Download Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.11.1-bin.zip
          unzip -q gradle-8.11.1-bin.zip

      - name: Build APK
        run: |
          ./gradle-8.11.1/bin/gradle assembleDebug --stacktrace

      - name: Upload DesignCAD APK
        uses: actions/upload-artifact@v4
        with:
          name: DesignCAD-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
