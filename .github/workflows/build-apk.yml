name: Build DesignCAD APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    name: Build DesignCAD
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create project
        shell: bash
        run: |
          mkdir -p app/src/main/java/com/example/designcad
          mkdir -p app/src/main/res/values

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "DesignCAD"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.example.designcad"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.example.designcad"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = 1
                  versionName = "0.1.0"
              }
          }

          kotlin {
              jvmToolchain(17)
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:theme="@style/AppTheme"
                  android:label="DesignCAD"
                  android:allowBackup="true">
                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="landscape"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme"
                  parent="@android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#4285F4</item>
                  <item name="android:navigationBarColor">#101114</item>
                  <item name="android:statusBarColor">#101114</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/java/com/example/designcad/MainActivity.kt <<'EOF'
          package com.example.designcad

          import android.app.Activity
          import android.graphics.*
          import android.os.Bundle
          import android.view.MotionEvent
          import android.view.View
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.TextView
          import kotlin.math.cos
          import kotlin.math.sin

          class MainActivity : Activity() {

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  val root = LinearLayout(this)
                  root.orientation = LinearLayout.VERTICAL
                  root.setBackgroundColor(Color.rgb(20, 21, 25))

                  val toolbar = LinearLayout(this)
                  toolbar.orientation = LinearLayout.HORIZONTAL

                  val title = TextView(this)
                  title.text = "  DesignCAD"
                  title.textSize = 20f
                  title.setTextColor(Color.WHITE)

                  toolbar.addView(
                      title,
                      LinearLayout.LayoutParams(
                          0,
                          -2,
                          1f
                      )
                  )

                  val cube = Button(this)
                  cube.text = "＋ Куб"

                  val reset = Button(this)
                  reset.text = "Сброс"

                  toolbar.addView(cube)
                  toolbar.addView(reset)

                  root.addView(toolbar)

                  val view = CadView(this)

                  root.addView(
                      view,
                      LinearLayout.LayoutParams(
                          -1,
                          0,
                          1f
                      )
                  )

                  cube.setOnClickListener {
                      view.resetCube()
                  }

                  reset.setOnClickListener {
                      view.resetCube()
                  }

                  setContentView(root)
              }

              class CadView(
                  activity: Activity
              ) : View(activity) {

                  private var rotationX = -25f
                  private var rotationY = 35f

                  private var lastX = 0f
                  private var lastY = 0f

                  private val paint =
                      Paint(Paint.ANTI_ALIAS_FLAG)

                  private val line =
                      Paint(Paint.ANTI_ALIAS_FLAG)

                  init {
                      setBackgroundColor(
                          Color.rgb(22, 23, 27)
                      )

                      line.style =
                          Paint.Style.STROKE

                      line.strokeWidth = 3f
                      line.color = Color.DKGRAY
                  }

                  fun resetCube() {
                      rotationX = -25f
                      rotationY = 35f
                      invalidate()
                  }

                  override fun onDraw(
                      canvas: Canvas
                  ) {
                      super.onDraw(canvas)

                      drawGrid(canvas)
                      drawCube(canvas)
                  }

                  private fun drawGrid(
                      canvas: Canvas
                  ) {
                      val p =
                          Paint(Paint.ANTI_ALIAS_FLAG)

                      p.color =
                          Color.rgb(38, 40, 46)

                      for (i in -10..10) {

                          val x =
                              width / 2f +
                                      i * 35f

                          canvas.drawLine(
                              x,
                              height / 2f - 350,
                              x,
                              height / 2f + 350,
                              p
                          )
                      }

                      for (i in -10..10) {

                          val y =
                              height / 2f +
                                      i * 35f

                          canvas.drawLine(
                              width / 2f - 350,
                              y,
                              width / 2f + 350,
                              y,
                              p
                          )
                      }
                  }

                  private fun drawCube(
                      canvas: Canvas
                  ) {

                      val size = 1.5f

                      val vertices =
                          arrayOf(
                              floatArrayOf(-size, -size, -size),
                              floatArrayOf(size, -size, -size),
                              floatArrayOf(size, size, -size),
                              floatArrayOf(-size, size, -size),

                              floatArrayOf(-size, -size, size),
                              floatArrayOf(size, -size, size),
                              floatArrayOf(size, size, size),
                              floatArrayOf(-size, size, size)
                          )

                      val points =
                          vertices.map {
                              project(
                                  it[0],
                                  it[1],
                                  it[2]
                              )
                          }

                      val faces =
                          arrayOf(
                              intArrayOf(4, 5, 6, 7),
                              intArrayOf(0, 1, 2, 3),
                              intArrayOf(0, 4, 7, 3),
                              intArrayOf(1, 5, 6, 2),
                              intArrayOf(3, 7, 6, 2),
                              intArrayOf(0, 4, 5, 1)
                          )

                      paint.style =
                          Paint.Style.FILL

                      paint.color =
                          Color.rgb(
                              85,
                              115,
                              150
                          )

                      for (face in faces) {

                          val path =
                              Path()

                          path.moveTo(
                              points[face[0]].first,
                              points[face[0]].second
                          )

                          for (i in 1..3) {
                              path.lineTo(
                                  points[face[i]].first,
                                  points[face[i]].second
                              )
                          }

                          path.close()

                          canvas.drawPath(
                              path,
                              paint
                          )

                          canvas.drawPath(
                              path,
                              line
                          )
                      }
                  }

                  private fun project(
                      x: Float,
                      y: Float,
                      z: Float
                  ): Pair<Float, Float> {

                      val ry =
                          Math.toRadians(
                              rotationY.toDouble()
                          )

                      val cy =
                          cos(ry).toFloat()

                      val sy =
                          sin(ry).toFloat()

                      val x1 =
                          x * cy - z * sy

                      val z1 =
                          x * sy + z * cy

                      val rx =
                          Math.toRadians(
                              rotationX.toDouble()
                          )

                      val cx =
                          cos(rx).toFloat()

                      val sx =
                          sin(rx).toFloat()

                      val y2 =
                          y * cx - z1 * sx

                      val scale =
                          8f /
                                  (8f + z1)

                      return Pair(
                          width / 2f +
                                  x1 * 130f * scale,
                          height / 2f -
                                  y2 * 130f * scale
                      )
                  }

                  override fun onTouchEvent(
                      event: MotionEvent
                  ): Boolean {

                      when (event.action) {

                          MotionEvent.ACTION_DOWN -> {
                              lastX = event.x
                              lastY = event.y
                          }

                          MotionEvent.ACTION_MOVE -> {

                              val dx =
                                  event.x - lastX

                              val dy =
                                  event.y - lastY

                              rotationY +=
                                  dx * 0.5f

                              rotationX =
                                  (rotationX +
                                          dy * 0.5f)
                                      .coerceIn(
                                          -89f,
                                          89f
                                      )

                              lastX = event.x
                              lastY = event.y

                              invalidate()
                          }
                      }

                      return true
                  }
              }
          }
          EOF

      - name: Build APK
        run: |
          gradle wrapper --gradle-version 8.11.1
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DesignCAD-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
