name: Build DesignCAD APK

on:
  workflow_dispatch:

jobs:
  build:
    name: Test DesignCAD Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Java
        run: java -version

      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          adb --version

      - name: Create test file
        run: |
          mkdir -p app
          echo "DesignCAD build test" > app/build-info.txt

      - name: Upload test
        uses: actions/upload-artifact@v4
        with:
          name: DesignCAD-test
          path: app/build-info.txt
